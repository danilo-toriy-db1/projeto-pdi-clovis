<app-header
  [paginas]="paginasPainel"
  [paginaAtiva]="vistaAtual()"
  (paginaSelecionada)="selecionarVista($event)"
/>

<main class="painel-admin">
  @switch (vistaAtual()) {
    @case ('editar-dados') {
      <app-editar-dados />
    }
    @case ('editar-usuarios') {
      <app-editar-usuarios />
    }
    @default {
      <app-pagina-inicial-admin (irParaEditarDados)="selecionarVista('editar-dados')" />
    }
  }
</main>

<app-footer />

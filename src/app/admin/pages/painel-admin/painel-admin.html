<app-header
  [paginas]="paginasPainel()"
  [paginaAtiva]="vistaAtual()"
  [contadorNotificacoes]="contadorNotificacoes()"
  (paginaSelecionada)="selecionarVista($event)"
  (abrirNotificacoes)="abrirNotificacoes()"
/>

<main class="painel-admin">
  @switch (vistaAtual()) {
    @case ('editar-dados') {
      <app-editar-dados />
    }
    @case ('editar-usuarios') {
      <app-editar-usuarios />
    }
    @case ('solicitacoes') {
      <app-solicitacoes-habilidade />
    }
    @case ('notificacoes') {
      <app-notificacoes-admin />
    }
    @default {
      <app-pagina-inicial-admin
        (irParaEditarDados)="selecionarVista('editar-dados')"
        (irParaEditarUsuarios)="selecionarVista('editar-usuarios')"
      />
    }
  }
</main>

<app-footer />

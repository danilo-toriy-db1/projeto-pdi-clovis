<div class="feedback-modal">
  @if (estado() === 'carregando') {
    <span class="feedback-modal__spinner" aria-hidden="true"></span>
  } @else if (estado() === 'sucesso') {
    <svg
      class="feedback-modal__check"
      viewBox="0 0 24 24"
      width="32"
      height="32"
      aria-hidden="true"
    >
      <path
        d="M5 13l4 4L19 7"
        stroke="currentColor"
        stroke-width="2"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  }

  <p role="status" aria-live="polite">{{ textoExibido() }}</p>
</div>
